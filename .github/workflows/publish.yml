
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # e.g. v2.0.3; setuptools-scm strips the "v" automatically

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/tests.yml   # tests before publishing to pypi

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs full history and tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: |
          twine check --strict dist/*
          ls dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dimorphite_dl
    permissions:
      id-token: write   # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
